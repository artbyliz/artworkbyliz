<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #707070;
            --spacing: 2rem;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }

        header {
            padding: 4rem var(--spacing);
            text-align: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--accent-color);
            font-style: italic;
        }

        /* The Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 0 var(--spacing) 4rem var(--spacing);
            max-width: 1400px;
            margin: 0 auto;
        }

        .art-card {
            overflow: hidden;
            background: #f9f9f9;
            transition: opacity 0.3s ease;
        }

        .art-card img {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(20%);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.3s ease;
        }

        .art-card:hover img {
            transform: scale(1.03);
            filter: grayscale(0%);
        }

        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: var(--accent-color);
            border-top: 1px solid #eee;
        }

        @media (max-width: 600px) {
            header { padding: 2rem 1rem; }
            .gallery { padding: 0 1rem 2rem 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <p class="subtitle">Selected Works & Explorations</p>
    </header>

    <main class="gallery">
        <div class="art-card">
            <img src="https://scontent-lga3-2.xx.fbcdn.net/v/t39.30808-6/622833583_10240795182395900_2668240820024030370_n.jpg?stp=cp6_dst-jpg_tt6&_nc_cat=100&ccb=1-7&_nc_sid=f727a1&_nc_ohc=JhmgnoVrjq8Q7kNvwG3-96G&_nc_oc=AdnjrFN66qrCwyrhVDPM1m1-SASwmj5HZdY7LIfYa_CdzpxN4ta1QVomKqFn9jMsXMUWlQIcOq_6Y1Y7ZJlF0Etj&_nc_zt=23&_nc_ht=scontent-lga3-2.xx&_nc_gid=2IeagHbjYqdQITfaqBMhzA&oh=00_Afp5hYzev5kjqS7J8lFi-gppZ3KPMk46bnomKZf9TUNfGQ&oe=698143DD" alt="Artwork Description">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Art Showcase. Mom <3</p>
    </footer>

</body>
</html>
