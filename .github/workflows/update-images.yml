name: Generate Image List

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          node -e "
            const fs = require('fs');
            const path = 'images';
            if (!fs.existsSync(path)) fs.mkdirSync(path);
            const files = fs.readdirSync(path).filter(f => /\.(jpe?g|png|webp)$/i.test(f));

            const list = files.map(f => {
              const base = f.replace(/\.[^/.]+$/, '');
              const parts = base.split('-');

              const meta = {
                src: 'images/' + f,
                filename: f,
                title: '',
                id: '',
                view: '',
                cat: [],
                style: [],
                theme: [],
                color: []
              };

              const titleWords = [];

              parts.forEach(part => {
                if (part.includes('=')) {
                  const [key, ...valParts] = part.split('=');
                  const val = valParts.join('=').trim();
                  const k = key.trim().toLowerCase();

                  if (Array.isArray(meta[k])) {
                    if (!meta[k].includes(val)) meta[k].push(val);
                  } else if (k in meta) {
                    meta[k] = val;
                  }
                } else {
                  // Non key=value parts form the title
                  titleWords.push(part.trim());
                }
              });

              // Clean up title: remove leading numbers/dashes and capitalize
              let cleanedTitle = titleWords.join(' ').replace(/^(\d+[\s_-]*)/, '');
              meta.title = cleanedTitle
                ? cleanedTitle.charAt(0).toUpperCase() + cleanedTitle.slice(1)
                : (meta.id || base);

              return meta;
            });

            fs.writeFileSync('images.json', JSON.stringify(list, null, 2));
          "

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images.json
          git commit -m "Auto-update images.json with tag metadata [skip ci]" || exit 0
          git push
